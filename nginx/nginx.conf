events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    upstream leadfinder_backend {
        server leadfinder:8000;
    }

    upstream landing_backend {
        server landing-page:80;
    }

    # ---- Dashboard: reachable on the bare server IP (port 80) ----
    # Also serves ACME challenges for any domain that doesn't have its
    # own server block yet (that's how the first certificate is issued).
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            proxy_pass http://leadfinder_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Landing page preview: port 8080, no domain needed ----
    server {
        listen 8080 default_server;
        server_name _;

        location / {
            proxy_pass http://landing_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ---- Per-domain server blocks, generated by the dashboard ----
    include /etc/nginx/sites/*.conf;
}
