<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}leadfinder{% endblock %} — VPS starter</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="top__inner">
      <span class="brand">lead<b>finder</b>{% if dry_run %} <span class="pill pill--warn">dry run</span>{% endif %}</span>
      {% block nav %}
      <nav>
        <a href="/" {% if active == 'leads' %}class="on"{% endif %}>Leads</a>
        <a href="/settings" {% if active == 'settings' %}class="on"{% endif %}>Settings</a>
        <a href="/domains" {% if active == 'domains' %}class="on"{% endif %}>Domains</a>
        <a href="/logout">Log out</a>
      </nav>
      {% endblock %}
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Part of the <a href="https://andreaskra.com/guides/vps-hosting.html">VPS starter kit</a>.</footer>
</body>
</html>
